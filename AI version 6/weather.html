<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1f1c; --muted:#8a938b; --line:#e9ece8; --bg:#f4f6f3; --card:#ffffff;
    --red:#e0554f; --red-bg:#fdeceb; --amber:#e0a536; --amber-bg:#fdf3e2;
    --green:#3fae4a; --green-bg:#eaf6ea; --blue:#3f8fe0; --blue-bg:#eaf2fd;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .app{ display:flex; min-height:100vh; }

  .sidebar{ width:220px; background:#fff; border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
  .brand{ display:flex;align-items:center;gap:8px; padding:6px 8px 18px; font-weight:800;font-size:16px; }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);}
  .nav-link{ display:flex;align-items:center;gap:10px; padding:10px 12px; border-radius:10px; font-size:13px;font-weight:600; color:#6b746a; cursor:pointer; text-decoration:none; }
  .nav-link.active{background:#eef4ec;color:#245c2c;}
  .nav-link svg{width:16px;height:16px;flex-shrink:0;}

  .main{ flex:1; padding:22px 28px; display:flex; flex-direction:column; gap:18px; min-width:0; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .topbar h1{font-size:20px;margin:0;font-weight:800;}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}

  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .kpi-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; }
  .kpi-card .label{font-size:11px;color:var(--muted);font-weight:600;}
  .kpi-card .value{font-size:22px;font-weight:800;margin-top:4px;}
  .kpi-card .trend{font-size:11px;margin-top:4px;font-weight:600;}
  .trend.up{color:var(--red);}
  .trend.down{color:var(--green);}

  .alert-banner{
    display:flex; align-items:center; gap:12px;
    background:var(--red-bg); border:1px solid #f6d3d0;
    border-radius:14px; padding:14px 16px;
  }
  .alert-banner svg{ width:20px;height:20px; color:var(--red); flex-shrink:0; }
  .alert-banner .txt{ font-size:13px; color:#5c2c29; }
  .alert-banner .txt b{ color:#3d1d1b; }

  .weather-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:14px; }
  .wc-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:16px; cursor:pointer; transition:.15s;
  }
  .wc-card:hover{ border-color:#c9d3c5; transform:translateY(-1px); }
  .wc-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
  .wc-loc{ font-size:14px; font-weight:800; }
  .wc-sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .wc-icon{ width:34px;height:34px; }

  .wc-temp{ font-size:30px; font-weight:800; margin:6px 0 2px; }
  .wc-cond{ font-size:12px; color:var(--muted); margin-bottom:12px; }

  .wc-stats{ display:flex; gap:14px; font-size:11px; color:#5b6a58; padding-top:10px; border-top:1px solid #f1f3ef; }
  .wc-stats span{ display:flex; align-items:center; gap:5px; }
  .wc-stats svg{ width:13px;height:13px; color:#8a938b; }

  .risk-chip{ font-size:10px;font-weight:700; padding:3px 9px;border-radius:20px; display:inline-flex;align-items:center;gap:4px; white-space:nowrap; }
  .risk-chip .d{width:6px;height:6px;border-radius:50%;}
  .risk-chip.high{background:var(--red-bg);color:var(--red);} .risk-chip.high .d{background:var(--red);}
  .risk-chip.med{background:var(--amber-bg);color:var(--amber);} .risk-chip.med .d{background:var(--amber);}
  .risk-chip.low{background:var(--green-bg);color:var(--green);} .risk-chip.low .d{background:var(--green);}

  /* Drawer */
  .overlay{ position:fixed; inset:0; background:rgba(20,25,20,0.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:#fff; z-index:50;
    box-shadow:-20px 0 50px rgba(0,0,0,.15); transform:translateX(100%); transition:transform .3s ease;
    overflow-y:auto; padding:22px;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; }
  .drawer-head h2{ margin:0; font-size:18px; font-weight:800; }
  .drawer-head .id{ font-size:12px; color:var(--muted); margin-top:2px; }
  .close-btn{ width:32px;height:32px; border-radius:9px; background:#f4f6f3; border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0; }
  .close-btn svg{width:15px;height:15px;}

  .section-title{ font-size:13px;font-weight:700; margin:16px 0 8px; }
  .section-title:first-of-type{ margin-top:0; }

  .forecast-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .forecast-day{
    flex-shrink:0; width:64px; text-align:center;
    background:#f8faf7; border-radius:12px; padding:10px 6px;
  }
  .forecast-day .d{ font-size:11px; color:var(--muted); font-weight:600; }
  .forecast-day svg{ width:22px;height:22px; margin:6px 0; color:#5b6a58; }
  .forecast-day .t{ font-size:13px; font-weight:800; }
  .forecast-day .r{ font-size:10px; color:var(--blue); margin-top:2px; }

  .weather-box{ background:#f8faf7; border-radius:14px; padding:12px 14px; }
  .weather-item{ display:flex;align-items:center;justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid #ecefe9; }
  .weather-item:last-child{ border-bottom:none; }
  .weather-item .l{ display:flex;align-items:center;gap:8px; color:#5b6a58; font-weight:600; }
  .weather-item .l svg{ width:15px;height:15px;color:#8a938b; }
  .weather-item .v{ font-weight:700; }

  .ai-box{
    background:var(--blue-bg); border:1px solid #cfe1fa; border-radius:14px; padding:13px 14px;
    display:flex; gap:9px; margin-top:16px;
  }
  .ai-box svg{ width:16px;height:16px;color:var(--blue);flex-shrink:0;margin-top:1px; }
  .ai-box .txt{ font-size:12.5px; line-height:1.5; color:#243b5c; }
  .ai-box .txt b{ color:#152640; }

  @media (max-width:900px){
    
    .kpi-row{ grid-template-columns:1fr 1fr; }
    .weather-grid{ grid-template-columns:1fr; }
  }

  /* ============================================================
     MOBILE NAVIGATION
     Below 900px the fixed sidebar becomes a slide-in drawer,
     opened by a hamburger button, instead of just disappearing
     with no way to navigate between pages.
     ============================================================ */
  .mobile-topbar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:12px 16px;
    position:sticky;
    top:0;
    z-index:35;
  }
  .mobile-topbar .brand{ padding:0; }
  .hamburger-btn{
    width:38px;height:38px;
    border-radius:10px;
    background:#f4f6f3;
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink);
    flex-shrink:0;
  }
  .hamburger-btn svg{ width:18px;height:18px; }

  .sidebar-overlay{
    position:fixed; inset:0;
    background:rgba(20,25,20,0.4);
    z-index:59;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .sidebar-overlay.open{ opacity:1; pointer-events:auto; }

  @media (max-width:900px){
    .mobile-topbar{ display:flex; }
    .sidebar{
      position:fixed;
      top:0; bottom:0; left:0;
      z-index:60;
      transform:translateX(-100%);
      transition:transform .25s ease;
      box-shadow:10px 0 30px rgba(0,0,0,.12);
    }
    .sidebar.open{ transform:translateX(0); }
  }


  @media (max-width:480px){
    .kpi-row{ grid-template-columns:1fr 1fr; gap:10px; }
    .kpi-card{ padding:12px; }
    .kpi-card .value{ font-size:18px; }
    .topbar{ flex-direction:column; align-items:flex-start; gap:10px; }
    .main{ padding:16px; gap:14px; }
  }
</style>
</head>
<body>

<div class="mobile-topbar">
  <div class="brand"><span class="dot"></span>FoodRoute AI</div>
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebarNav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">
  <div class="sidebar" id="sidebarNav">
    <div class="brand"><span class="dot"></span>FoodRoute AI</div>
    <a class="nav-link" href="shipment-risk-dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </a>
    <a class="nav-link" href="shipments.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>
      Shipments
    </a>
    <a class="nav-link" href="routes.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5-2V6l5 2m0 12l6-2m-6 2V8m6 10l5 2V8l-5-2m0 14V6m0 2L9 6"/></svg>
      Routes
    </a>
    <a class="nav-link active" href="weather.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 2.2A4 4 0 0 0 6 19h11.5z"/></svg>
      Weather
    </a>
     <a class="nav-link" href="dealer-suggestion.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.2-9.5-9.6C.7 7.9 2.3 4 6 4c2 0 3.4 1.1 4 2.2C10.6 5.1 12 4 14 4c3.7 0 5.3 3.9 3.5 7.4C19 15.8 12 21 12 21z"/></svg>
      Dealer Match
    </a>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Weather</h1>
        <div class="sub" id="resultCount">Conditions across all active shipment locations</div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-card"><div class="label">Locations Monitored</div><div class="value" id="kpiTotal">-</div></div>
      <div class="kpi-card"><div class="label">Active Alerts</div><div class="value" id="kpiAlerts">-</div><div class="trend up">Rain &gt; 60%</div></div>
      <div class="kpi-card"><div class="label">Avg. Temp</div><div class="value" id="kpiTemp">-</div></div>
      <div class="kpi-card"><div class="label">Avg. Rain Chance</div><div class="value" id="kpiRain">-</div></div>
    </div>

    <div class="alert-banner" id="alertBanner" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div class="txt" id="alertText"></div>
    </div>

    <div class="weather-grid" id="weatherGrid"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>

<script>
  // ============================================================
  // WEATHER LOCATIONS
  // In a real app, fetch this from a weather API per unique
  // origin/destination in your shipments, e.g.:
  //   const locations = await fetch('/api/weather').then(r => r.json());
  // ============================================================
  const locations = [
    {
      name: "Kattur", temp: 29, rain: 82, humidity: 91, wind: 18, condition: "Heavy Rain",
      forecast: [
        { d: "Today", t: 29, r: 82 }, { d: "Tue", t: 27, r: 74 }, { d: "Wed", t: 28, r: 55 },
        { d: "Thu", t: 30, r: 30 }, { d: "Fri", t: 31, r: 12 }
      ],
      note: "Heavy rainfall expected to continue through tomorrow. Shipments departing Kattur in the next 12 hours face elevated spoilage risk — consider delaying dispatch until conditions ease."
    },
    {
      name: "Chennai", temp: 30, rain: 45, humidity: 70, wind: 14, condition: "Partly Cloudy",
      forecast: [
        { d: "Today", t: 30, r: 45 }, { d: "Tue", t: 31, r: 38 }, { d: "Wed", t: 32, r: 20 },
        { d: "Thu", t: 32, r: 15 }, { d: "Fri", t: 31, r: 25 }
      ],
      note: "Conditions are moderate. No immediate action needed, but monitor incoming shipments from high-rain origins."
    },
    {
      name: "Erode", temp: 31, rain: 40, humidity: 68, wind: 10, condition: "Cloudy",
      forecast: [
        { d: "Today", t: 31, r: 40 }, { d: "Tue", t: 30, r: 35 }, { d: "Wed", t: 29, r: 42 },
        { d: "Thu", t: 30, r: 28 }, { d: "Fri", t: 31, r: 18 }
      ],
      note: "Stable conditions expected. Onion shipments should be fine with standard ventilation."
    },
    {
      name: "Coimbatore", temp: 28, rain: 30, humidity: 58, wind: 12, condition: "Clear",
      forecast: [
        { d: "Today", t: 28, r: 30 }, { d: "Tue", t: 29, r: 22 }, { d: "Wed", t: 29, r: 18 },
        { d: "Thu", t: 30, r: 10 }, { d: "Fri", t: 30, r: 8 }
      ],
      note: "Favorable conditions across the week. No weather-related risk expected."
    },
    {
      name: "Thanjavur", temp: 33, rain: 8, humidity: 45, wind: 9, condition: "Sunny",
      forecast: [
        { d: "Today", t: 33, r: 8 }, { d: "Tue", t: 34, r: 5 }, { d: "Wed", t: 33, r: 6 },
        { d: "Thu", t: 32, r: 12 }, { d: "Fri", t: 33, r: 9 }
      ],
      note: "Dry, stable conditions ideal for rice and grain shipments."
    },
    {
      name: "Trichy", temp: 28, rain: 70, humidity: 85, wind: 22, condition: "Storm Warning",
      forecast: [
        { d: "Today", t: 28, r: 70 }, { d: "Tue", t: 26, r: 88 }, { d: "Wed", t: 27, r: 60 },
        { d: "Thu", t: 29, r: 35 }, { d: "Fri", t: 30, r: 20 }
      ],
      note: "A storm cell is forming near Trichy with high wind speeds. Perishable shipments in transit should reroute away from this zone where possible."
    },
    {
      name: "Salem", temp: 27, rain: 55, humidity: 78, wind: 16, condition: "Rain Showers",
      forecast: [
        { d: "Today", t: 27, r: 55 }, { d: "Tue", t: 28, r: 48 }, { d: "Wed", t: 28, r: 40 },
        { d: "Thu", t: 29, r: 22 }, { d: "Fri", t: 29, r: 15 }
      ],
      note: "Moderate rain expected today, easing over the week. Keep cold-chain checks active."
    },
    {
      name: "Ooty", temp: 22, rain: 35, humidity: 60, wind: 11, condition: "Light Rain",
      forecast: [
        { d: "Today", t: 22, r: 35 }, { d: "Tue", t: 21, r: 40 }, { d: "Wed", t: 22, r: 30 },
        { d: "Thu", t: 23, r: 20 }, { d: "Fri", t: 23, r: 15 }
      ],
      note: "Cool, favorable temperatures for root vegetables. Light rain poses minimal risk."
    }
  ];

  function weatherIcon(condition){
    if (condition.includes("Storm") || condition.includes("Heavy")) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 15a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 2.2A4 4 0 0 0 6 15h4"/><path d="M13 13l-2 4h3l-2 4M8 19l-1 2"/></svg>`;
    }
    if (condition.includes("Rain")) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 15a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 2.2A4 4 0 0 0 6 15h11.5z"/><path d="M8 19v2M12 19v2M16 19v2"/></svg>`;
    }
    if (condition.includes("Cloudy")) {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4 2.2A4 4 0 0 0 6 19h11.5z"/></svg>`;
    }
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`;
  }

  function riskFromRain(rain){
    if (rain >= 60) return "high";
    if (rain >= 30) return "med";
    return "low";
  }
  function riskLabel(r){
    return r === "high" ? "High Risk" : r === "med" ? "Medium Risk" : "Low Risk";
  }

  function renderKpis(){
    const total = locations.length;
    const alerts = locations.filter(l => l.rain >= 60).length;
    const avgTemp = Math.round(locations.reduce((s, l) => s + l.temp, 0) / total);
    const avgRain = Math.round(locations.reduce((s, l) => s + l.rain, 0) / total);
    document.getElementById("kpiTotal").textContent = total;
    document.getElementById("kpiAlerts").textContent = alerts;
    document.getElementById("kpiTemp").textContent = avgTemp + "°C";
    document.getElementById("kpiRain").textContent = avgRain + "%";

    const banner = document.getElementById("alertBanner");
    if (alerts > 0) {
      const names = locations.filter(l => l.rain >= 60).map(l => l.name).join(", ");
      document.getElementById("alertText").innerHTML =
        `<b>${alerts} location${alerts > 1 ? 's' : ''} on high alert:</b> ${names}. Heavy rainfall may affect shipments departing from or passing through these areas.`;
      banner.style.display = "flex";
    } else {
      banner.style.display = "none";
    }
  }

  function renderGrid(){
    const grid = document.getElementById("weatherGrid");
    grid.innerHTML = locations.map(l => {
      const risk = riskFromRain(l.rain);
      return `
        <div class="wc-card" data-name="${l.name}">
          <div class="wc-head">
            <div>
              <div class="wc-loc">${l.name}</div>
              <div class="wc-sub">${l.condition}</div>
            </div>
            <div class="wc-icon">${weatherIcon(l.condition)}</div>
          </div>
          <div class="wc-temp">${l.temp}°C</div>
          <div class="wc-cond"><span class="risk-chip ${risk}"><span class="d"></span>${riskLabel(risk)}</span></div>
          <div class="wc-stats">
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"/></svg>${l.rain}%</span>
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10M12 22a4 4 0 0 0 2-7.5V4a2 2 0 0 0-4 0v10.5A4 4 0 0 0 12 22z"/></svg>${l.humidity}%</span>
            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 4.5a2.5 2.5 0 1 1 2.5 2.5H2M12.5 19.5A2.5 2.5 0 1 0 15 17H2M17 9.5a3 3 0 1 1 3 3H2"/></svg>${l.wind} km/h</span>
          </div>
        </div>
      `;
    }).join("");

    grid.querySelectorAll(".wc-card").forEach(card => {
      card.addEventListener("click", () => openDrawer(card.dataset.name));
    });
  }

  function openDrawer(name){
    const l = locations.find(x => x.name === name);
    if (!l) return;
    const risk = riskFromRain(l.rain);
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");

    drawer.innerHTML = `
      <div class="drawer-head">
        <div>
          <h2>${l.name}</h2>
          <div class="id">${l.condition} · ${l.temp}°C</div>
        </div>
        <button class="close-btn" id="closeDrawerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <span class="risk-chip ${risk}" style="font-size:11px;padding:5px 12px;display:inline-flex;">
        <span class="d"></span>${riskLabel(risk)}
      </span>

      <div class="section-title">5-Day Forecast</div>
      <div class="forecast-row">
        ${l.forecast.map(f => `
          <div class="forecast-day">
            <div class="d">${f.d}</div>
            ${weatherIcon(f.r >= 60 ? "Rain" : f.r >= 30 ? "Cloudy" : "Clear")}
            <div class="t">${f.t}°</div>
            <div class="r">${f.r}%</div>
          </div>
        `).join("")}
      </div>

      <div class="section-title">Current Conditions</div>
      <div class="weather-box">
        <div class="weather-item"><div class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"/></svg>Rain Chance</div><div class="v">${l.rain}%</div></div>
        <div class="weather-item"><div class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10M12 22a4 4 0 0 0 2-7.5V4a2 2 0 0 0-4 0v10.5A4 4 0 0 0 12 22z"/></svg>Humidity</div><div class="v">${l.humidity}%</div></div>
        <div class="weather-item"><div class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 4.5a2.5 2.5 0 1 1 2.5 2.5H2M12.5 19.5A2.5 2.5 0 1 0 15 17H2M17 9.5a3 3 0 1 1 3 3H2"/></svg>Wind Speed</div><div class="v">${l.wind} km/h</div></div>
        <div class="weather-item"><div class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/></svg>Temperature</div><div class="v">${l.temp}°C</div></div>
      </div>

      <div class="ai-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div class="txt"><b>Note:</b> ${l.note}</div>
      </div>
    `;

    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    drawer.classList.add("open");
    overlay.classList.add("open");
  }

  function closeDrawer(){
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("overlay").classList.remove("open");
  }
  document.getElementById("overlay").addEventListener("click", closeDrawer);

  renderKpis();
  renderGrid();

  // ---- Mobile nav: hamburger opens/closes the slide-in sidebar ----
  (function(){
    const btn = document.getElementById("hamburgerBtn");
    const sidebar = document.getElementById("sidebarNav");
    const overlay = document.getElementById("sidebarOverlay");
    if (!btn || !sidebar || !overlay) return;

    function openNav(){
      sidebar.classList.add("open");
      overlay.classList.add("open");
      btn.setAttribute("aria-expanded", "true");
    }
    function closeNav(){
      sidebar.classList.remove("open");
      overlay.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    }
    btn.addEventListener("click", () => {
      sidebar.classList.contains("open") ? closeNav() : openNav();
    });
    overlay.addEventListener("click", closeNav);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNav(); });
    // Close the drawer after tapping a nav link, so the next page
    // doesn't load with the menu still open.
    sidebar.querySelectorAll("a.nav-link").forEach(link => {
      link.addEventListener("click", closeNav);
    });
  })();

</script>

</body>
</html>
